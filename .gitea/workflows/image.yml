# Builds the BoundGate image for amd64 and arm64 and pushes it to this
# Gitea's container registry: every push to main becomes :latest (plus
# :sha-<commit>). Releases (tags v*) are built by release.yml. Needs an act_runner with
# Docker. The registry login uses the secret REGISTRY_TOKEN (an access token
# with package:write, Settings › Actions › Secrets); without it the job
# tries the workflow's own token.
#
# The same build from a Mac: make image-push (Makefile).
name: image
on:
  push:
    branches: [main]
    # Tags are release.yml's: it builds the image of a release once and signs
    # its digest into the manifest; a second build here would move the tag to
    # an image the manifest does not name.
    # Nothing of this ends up in the image:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'apps/**'
  # Re-run by hand (Actions > image > Run workflow), e.g. after a runner problem.
  workflow_dispatch:

# A newer push to the same ref replaces the build in progress instead of
# queueing behind it; only the image of the latest commit is wanted.
concurrency:
  group: image-${{ gitea.ref }}
  cancel-in-progress: true

env:
  # the Go that setup-go installs, never one that go.mod would download
  GOTOOLCHAIN: local

# Actions are pinned by commit (the tag in the comment): a moved tag would run
# someone else's code with the registry token. The job's own token may push
# packages and read the repository, nothing else.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # this Gitea's registry (unless REGISTRY_TOKEN is set)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: admin SPA (embedded into boundgate-control)
        run: cd web && npm ci --no-audit --no-fund && npm run build

      # the toolchain of go.mod's `toolchain` line, exactly (release.yml says why)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: toolchain
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          have=$(go env GOVERSION)
          [ -n "$want" ] && [ "$have" = "$want" ] || { echo "Go is $have, go.mod's toolchain line says ${want:-nothing}: change both together"; exit 1; }
      # reachable known vulnerabilities stop the image (release.yml does the same for releases)
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: binaries for every platform
        run: |
          # One go build per platform: the packages are loaded once and the four
          # binaries link side by side, instead of four runs one after the other.
          for arch in amd64 arm64; do
            mkdir -p bin/linux_$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o bin/linux_$arch/ \
              ./cmd/boundgate-control ./cmd/boundgate-node ./cmd/boundgatectl ./cmd/boundgate-mux
          done

      # binfmt and BuildKit run privileged on the runner host: pinned by digest
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      # A builder of its own for every run, removed at the end. The runner host
      # is shared with BDH/Nginx-WAF: a builder that kept its state there (as
      # this one did until 2026-09-25, to save the emulated arm64 apk install)
      # would build on layers that jobs of another project could have written.
      # Same resource limits as that project's builder.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          keep-state: false
          cleanup: true
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            memory=1g
            memory-swap=1536m
            cpuset-cpus=2-4
            cpu-shares=256
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gitlab.net407.com
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: gitlab.net407.com/sbh/boundgate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ gitea.sha }}
