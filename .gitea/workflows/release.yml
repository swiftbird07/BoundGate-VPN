# A tag vMAJOR.MINOR.PATCH starts a release. This half runs here: tests, Linux
# binaries, the container image, all parked in a DRAFT release together with
# build.json, a record of what was built. Nothing here signs anything and no
# signing key exists here.
#
# The other half runs on the maintainer's Mac (`make release`, which also
# pushed the tag): it builds, signs and notarizes the Mac app, signs the
# manifest over everything with the release key and publishes the draft
# (deploy/release/release.sh, docs/RELEASES.md). Clients install only what a
# signed manifest names, so a draft that nobody signs is just files.
#
# Secrets (Settings > Actions > Secrets):
#   REGISTRY_TOKEN   as for image.yml
#   RELEASE_TOKEN    optional: access token with write:repository, if the
#                    job's own token may not create releases
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ gitea.ref }}
  cancel-in-progress: false

env:
  IMAGE: gitlab.net407.com/sbh/boundgate
  VPKG: gitlab.net407.com/SBH/BoundGate-VPN/internal/version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: admin SPA (embedded into boundgate-control)
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests
        run: go vet ./... && go test ./...
      - name: binaries
        run: |
          V=${{ gitea.ref_name }}
          LD="-X $VPKG.Version=$V -X $VPKG.Commit=${{ gitea.sha }}"
          for arch in amd64 arm64; do
            mkdir -p bin/linux_$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LD" -o bin/linux_$arch/ \
              ./cmd/boundgate-control ./cmd/boundgate-node ./cmd/boundgatectl ./cmd/boundgate-mux
          done
          mkdir -p dist/release
          for arch in amd64 arm64; do
            tar -C bin/linux_$arch --owner=0 --group=0 --sort=name -czf dist/release/boundgate-$V-linux-$arch.tar.gz .
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          name: boundgate
          keep-state: true
          driver-opts: |
            memory=1g
            memory-swap=1536m
            cpuset-cpus=2-4
            cpu-shares=256
      - uses: docker/login-action@v3
        with:
          registry: gitlab.net407.com
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # the release is pinned by digest in the manifest; the tag is for people
          tags: ${{ env.IMAGE }}:${{ gitea.ref_name }}
          build-args: REVISION=${{ gitea.sha }}
      - name: draft release with what was built
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V=${{ gitea.ref_name }}
          API=${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          # the record the maintainer's side checks its downloads against
          COMMIT=${{ gitea.sha }} deploy/release/manifest.sh "$V" dist/release "$IMAGE" "${{ steps.image.outputs.digest }}" \
            | jq '.type = "boundgate-build"' > build.json
          cat build.json
          auth() { curl -fsS -H "Authorization: token $TOKEN" "$@"; }
          # a re-run replaces the draft of the same tag; a published release is never touched
          for id in $(auth "$API/releases?draft=true&limit=50" | jq -r --arg v "$V" '.[] | select(.tag_name == $v and .draft) | .id'); do
            auth -X DELETE "$API/releases/$id" >/dev/null
          done
          ID=$(jq -n --arg t "$V" '{tag_name:$t, name:$t, draft:true, body:"Built by CI, not signed yet. `make release VERSION=\($t)` on the maintainer\u0027s machine signs and publishes it."}' \
            | auth -X POST -H 'Content-Type: application/json' -d @- "$API/releases" | jq -r .id)
          for f in dist/release/*.tar.gz build.json; do
            auth -X POST -F "attachment=@$f" "$API/releases/$ID/assets?name=$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          echo "draft $V is ready to be signed"
