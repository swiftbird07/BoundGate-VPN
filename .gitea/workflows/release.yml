# A tag vMAJOR.MINOR.PATCH starts a release. This half runs here: tests, Linux
# binaries, the container image, all parked in a DRAFT release together with
# build.json, a record of what was built. Nothing here signs anything and no
# signing key exists here.
#
# The other half runs on the maintainer's Mac (`make release`, which also
# pushed the tag): it builds, signs and notarizes the Mac app, signs the
# manifest over everything with the release key and publishes the draft
# (deploy/release/release.sh, docs/RELEASES.md). Clients install only what a
# signed manifest names, so a draft that nobody signs is just files.
#
# The image goes to two registries in one push, so both hold the same digest:
# the project's own, and ghcr.io, which anyone can pull from. The manifest
# names the public one; update.sh pulls by the signed digest from either
# (BOUNDGATE_IMAGE_REPO).
#
# Secrets (Settings > Actions > Secrets):
#   REGISTRY_TOKEN   as for image.yml
#   GHCR_USER        GitHub user that owns the package
#   GHCR_TOKEN       classic GitHub token with write:packages (fine-grained
#                    tokens cannot push packages)
#   RELEASE_TOKEN    optional: access token with write:repository, if the
#                    job's own token may not create releases
# Whoever can push a v* tag starts this job with these secrets, and whoever can
# change .gitea/workflows on the tagged commit decides what it does with them:
# protect v* tags and main (docs/RELEASES.md, "Setting it up"), and give each
# token one package or repository, not an account.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ gitea.ref }}
  cancel-in-progress: false

env:
  # the Go that setup-go installs, never one that go.mod would download
  GOTOOLCHAIN: local
  IMAGE: gitlab.net407.com/sbh/boundgate
  PUBLIC_IMAGE: ghcr.io/swiftbird07/boundgate
  VPKG: gitlab.net407.com/SBH/BoundGate-VPN/internal/version

# Every action is pinned by the commit it was reviewed at (the tag in the
# comment): a tag can be moved by whoever controls the action's repository,
# and this job holds the tokens that push the image every server pulls.
# The job's own token may create the draft release and nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the draft release (unless RELEASE_TOKEN is set)
      packages: write     # the image in this Gitea's registry (unless REGISTRY_TOKEN is set)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # no npm cache either: a release takes nothing from what earlier jobs left on the runner
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: admin SPA (embedded into boundgate-control)
        run: cd web && npm ci --no-audit --no-fund && npm run build
      # Exactly the toolchain of go.mod's `toolchain` line (the `go` line is only
      # the minimum, and go-version-file would install that): the standard
      # library is linked into every binary, so its patch level is the one
      # that fixes or leaves its vulnerabilities. The next step refuses a drift.
      # No cache: a build cache on a shared runner would feed this build
      # objects that nothing here checks.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'
          check-latest: false
          cache: false
      - name: toolchain
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          have=$(go env GOVERSION)
          [ -n "$want" ] && [ "$have" = "$want" ] || { echo "Go is $have, go.mod's toolchain line says ${want:-nothing}: change both together"; exit 1; }
      - name: tests
        run: go vet ./... && GOOS=windows go vet ./... && go test ./...
      # Known vulnerabilities that the code can reach, in the standard library
      # and in the modules, for the Linux and the Windows builds: any finding
      # stops the release. golang.org/x/vuln pinned (released 2026-09-08).
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go run -exec 'env GOOS=windows' golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: binaries
        run: |
          V=${{ gitea.ref_name }}
          LD="-X $VPKG.Version=$V -X $VPKG.Commit=${{ gitea.sha }}"
          for arch in amd64 arm64; do
            mkdir -p bin/linux_$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LD" -o bin/linux_$arch/ \
              ./cmd/boundgate-control ./cmd/boundgate-node ./cmd/boundgatectl ./cmd/boundgate-mux
          done
          mkdir -p dist/release
          for arch in amd64 arm64; do
            tar -C bin/linux_$arch --owner=0 --group=0 --sort=name -czf dist/release/boundgate-$V-linux-$arch.tar.gz .
          done
          # Windows: service, CLI, tray (a GUI program: no console window) and the install scripts
          command -v zip >/dev/null || { apt-get update -qq && apt-get install -y -qq zip; }
          for arch in amd64 arm64; do
            mkdir -p bin/windows_$arch
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "$LD" -o bin/windows_$arch/ ./cmd/boundgate-node ./cmd/boundgatectl
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "$LD -H=windowsgui" -o bin/windows_$arch/ ./cmd/boundgate-tray
            deploy/windows/zip.sh "$V" $arch bin/windows_$arch dist/release
          done
      # binfmt and BuildKit run privileged on the runner host: pinned by digest,
      # like everything else that ends up in or builds the image
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      # A builder of its own for this run, removed at the end (cleanup): the
      # runner host is shared with another project, and a builder that keeps
      # its state there would hand this release whatever that cache holds.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          keep-state: false
          cleanup: true
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            memory=1g
            memory-swap=1536m
            cpuset-cpus=2-4
            cpu-shares=256
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: gitlab.net407.com
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # the release is pinned by digest in the manifest; the tag is for people
          tags: |
            ${{ env.IMAGE }}:${{ gitea.ref_name }}
            ${{ env.PUBLIC_IMAGE }}:${{ gitea.ref_name }}
          build-args: REVISION=${{ gitea.sha }}
      - name: draft release with what was built
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V=${{ gitea.ref_name }}
          API=${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          # the record the maintainer's side checks its downloads against
          # (with the Go that built it: release.sh refuses a draft built with another one)
          COMMIT=${{ gitea.sha }} deploy/release/manifest.sh "$V" dist/release "$PUBLIC_IMAGE" "${{ steps.image.outputs.digest }}" \
            | jq --arg go "$(go env GOVERSION)" '.type = "boundgate-build" | .go = $go' > build.json
          cat build.json
          auth() { curl -fsS -H "Authorization: token $TOKEN" "$@"; }
          # the network between runner and server has bad moments (a name that does not resolve, once):
          # an upload is tried again, after removing what an attempt may have left under that name
          upload() { # upload RELEASE-ID FILE
            name=$(basename "$2")
            for try in 1 2 3 4 5; do
              for old in $(auth "$API/releases/$1" | jq -r --arg n "$name" '.assets[]? | select(.name == $n) | .id'); do auth -X DELETE "$API/releases/$1/assets/$old" >/dev/null || true; done
              if auth -X POST -F "attachment=@$2" "$API/releases/$1/assets?name=$name" >/dev/null; then echo "uploaded $name"; return 0; fi
              echo "upload of $name failed (attempt $try)"; sleep $((try * 10))
            done
            return 1
          }
          # a re-run replaces the draft of the same tag; a published release is never touched
          for id in $(auth "$API/releases?draft=true&limit=50" | jq -r --arg v "$V" '.[] | select(.tag_name == $v and .draft) | .id'); do
            auth -X DELETE "$API/releases/$id" >/dev/null
          done
          ID=$(jq -n --arg t "$V" '{tag_name:$t, name:$t, draft:true, body:"Built by CI, not signed yet. `make release VERSION=\($t)` on the maintainer\u0027s machine signs and publishes it."}' \
            | auth -X POST -H 'Content-Type: application/json' -d @- "$API/releases" | jq -r .id)
          for f in dist/release/*.tar.gz dist/release/*.zip build.json; do upload "$ID" "$f"; done
          echo "draft $V is ready to be signed"
