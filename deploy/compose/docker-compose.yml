# Local development environment: everything runs in containers inside the
# Colima VM. TUN devices, routes and nftables live in the containers' own
# network namespaces; the macOS host is untouched.
#
#   make compose-up            # build binaries in the box, build images, start
#   make setup-dev             # dev admin key, confirm + sign hub1, hub2, node-r, node-a
#   docker compose -f deploy/compose/docker-compose.yml exec node-a boundgatectl up
#   docker compose -f deploy/compose/docker-compose.yml exec node-a curl -s http://10.60.0.10
#   make e2e                   # full M1.5..M3 check incl. HA, revocation, signed bindings, login, ACL
#
# Networks:
#   public   172.30.0.0/24  control (.5), idp (.6), hub1 (.10), hub2 (.11), node-a (.20), node-r (.30), node-t (.40, TPM key), node-m (.50, embedded engine)
#   internal 10.60.0.0/24   hub1 (.2), hub2 (.3), target (.10), target-tls (.11)   "behind the hubs"
#   lan      192.168.178.0/24 node-r (.30), target-lan (.10)        "Martin's home LAN"
#   overlay  10.21.0.0/16   assigned by the control plane at approval

name: boundgate

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.60.0.0/24
  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.178.0/24

x-node: &node
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile.node
    args:
      GOARCH: ${GOARCH:-arm64}
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  sysctls:
    net.ipv4.ip_forward: "1"
  depends_on: [control]

services:
  control:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control
      args:
        GOARCH: ${GOARCH:-arm64}
    networks:
      public:
        ipv4_address: 172.30.0.5
    ports:
      - "127.0.0.1:18443:443"     # admin API over TLS (self-signed dev cert); node channel fallback (TCP) for a node on the Mac (M5)
      - "127.0.0.1:18443:443/udp" # node channel over HTTP/3 for a node on the Mac
    volumes:
      - ./config:/etc/boundgate:ro
      - ./state/control:/var/lib/boundgate
      - ./logs/control:/var/log/boundgate
    command: ["boundgate-control", "-config", "/etc/boundgate/control.yaml"]

  # Fake OpenID Connect provider for the lab: logs "martin" in without
  # asking. Production uses Authentik (docs/OIDC.md).
  idp:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control
      args:
        GOARCH: ${GOARCH:-arm64}
    networks:
      public:
        ipv4_address: 172.30.0.6
        aliases: [idp.localhost]    # one issuer URL for both worlds: Docker DNS answers it in the lab, browsers map *.localhost to loopback on the Mac
    ports:
      - "127.0.0.1:19000:19000"
    command: ["boundgate-fakeidp", "-listen", ":19000", "-issuer", "http://idp.localhost:19000", "-client-id", "boundgate", "-client-secret", "dev-secret",
              "-user", "martin", "-email", "martin@example.test", "-groups", "vpn-users,admins"]

  # udpbridge: UDP-over-TCP into the lab for a node on the Mac host (M5).
  # Colima's default port forwarder carries TCP only; see cmd/boundgate-udpbridge.
  udpbridge:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control
      args:
        GOARCH: ${GOARCH:-arm64}
    networks:
      public:
        ipv4_address: 172.30.0.8
    ports:
      - "127.0.0.1:24431:24431"   # -> hub1 udp/443
      - "127.0.0.1:24432:24432"   # -> hub2 udp/443
    command: ["boundgate-udpbridge", "-server", ":24431=172.30.0.10:443,:24432=172.30.0.11:443"]

  # devproxy: plain-HTTP view of the admin name for browsers that refuse the
  # self-signed dev certificate (http://localhost is a secure context, so
  # passkeys work there too). Lab only; production speaks TLS only.
  devproxy:
    image: alpine/socat:1.8.0.0
    networks:
      public:
        ipv4_address: 172.30.0.7
    ports:
      - "127.0.0.1:18080:8080"
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "OPENSSL:control:443,verify=0,snihost=control"]
    depends_on: [control]

  hub1:
    <<: *node
    networks:
      public:
        ipv4_address: 172.30.0.10
      internal:
        ipv4_address: 10.60.0.2
    volumes:
      - ./config:/etc/boundgate:ro
      - ./state/hub1:/var/lib/boundgate
      - ./logs/hub1:/var/log/boundgate
    ports:
      - "127.0.0.1:14431:443/udp" # tunnel listener for a node on the Mac host (M5, hub_addrs override)
    command: ["boundgate-node", "-config", "/etc/boundgate/hub1.yaml"]

  hub2:
    <<: *node
    networks:
      public:
        ipv4_address: 172.30.0.11
      internal:
        ipv4_address: 10.60.0.3
    volumes:
      - ./config:/etc/boundgate:ro
      - ./state/hub2:/var/lib/boundgate
      - ./logs/hub2:/var/log/boundgate
    ports:
      - "127.0.0.1:14432:443/udp"
    command: ["boundgate-node", "-config", "/etc/boundgate/hub2.yaml"]

  node-a:
    <<: *node
    networks:
      public:
        ipv4_address: 172.30.0.20
    volumes:
      - ./config:/etc/boundgate:ro
      - ./state/node-a:/var/lib/boundgate
      - ./logs/node-a:/var/log/boundgate
    command: ["boundgate-node", "-config", "/etc/boundgate/node-a.yaml"]

  # M8.5: the node of the iOS and Android apps (internal/embed) with Linux
  # playing the platform: a tun by descriptor, settings in one piece, the
  # device key as a signer. Driven with boundgatectl like the others.
  node-m:
    <<: *node
    networks:
      public:
        ipv4_address: 172.30.0.50
    volumes:
      - ./state/node-m:/var/lib/boundgate
    command: ["boundgate-embedtest", "-control", "control:443", "-server-name", "nodes.control", "-name", "node-m"]

  node-r:
    <<: *node
    networks:
      public:
        ipv4_address: 172.30.0.30
      lan:
        ipv4_address: 192.168.178.30
    volumes:
      - ./config:/etc/boundgate:ro
      - ./state/node-r:/var/lib/boundgate
      - ./logs/node-r:/var/log/boundgate
    command: ["boundgate-node", "-config", "/etc/boundgate/node-r.yaml"]

  # M6: a node whose device key lives in a TPM. The "chip" is swtpm, a
  # software TPM 2.0 in a sidecar; the node talks to it over a unix socket in
  # a shared volume, the way a real node talks to /dev/tpmrm0. The TPM state
  # is a named volume: removing it is what swapping the mainboard would be.
  swtpm:
    build:
      context: .
      dockerfile: Dockerfile.swtpm
    network_mode: none
    volumes:
      - swtpm-state:/var/lib/swtpm
      - swtpm-run:/run/swtpm

  node-t:
    <<: *node
    depends_on: [control, swtpm]
    networks:
      public:
        ipv4_address: 172.30.0.40
    volumes:
      - ./config:/etc/boundgate:ro
      - ./state/node-t:/var/lib/boundgate
      - ./logs/node-t:/var/log/boundgate
      - swtpm-run:/run/swtpm
    command: ["boundgate-node", "-config", "/etc/boundgate/node-t.yaml"]

  target:
    image: traefik/whoami:v1.10.4
    networks:
      internal:
        ipv4_address: 10.60.0.10
    command: ["--port", "80", "--name", "target"]

  # TLS target for the SNI policy test: serves https on 443 with a
  # self-generated certificate and echoes the request.
  target-tls:
    image: mendhak/http-https-echo:35
    environment:
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
    networks:
      internal:
        ipv4_address: 10.60.0.11

  target-lan:
    image: traefik/whoami:v1.10.4
    networks:
      lan:
        ipv4_address: 192.168.178.10
    command: ["--port", "80", "--name", "target-lan"]

volumes:
  swtpm-state:
  swtpm-run:
