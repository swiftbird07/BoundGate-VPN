name: node-r
state_dir: /var/lib/boundgate
key_kind: softkey
control:
  addr: control:443
  server_name: nodes.control
  # pin: <hex spki>              # optional; default: pinned on first use into state_dir/control.pin
roles: [endpoint, subnet-router]                  # requested; an admin grants roles at approval
prefixes:
  - {prefix: 192.168.178.0/24, mode: snat}
public_addr: ""
listen: ":443"               # hub tunnel listener (UDP)
auto_up: true
profile: full
profiles_dir: /etc/boundgate/profiles
socket: /run/boundgate/node.sock
tun_name: bg0
log_dir: /var/log/boundgate
log_stdout: true
# privilege separation (docs/PRIVSEP.md): packets, tunnels and the control
# channel run as uid 65531; root keeps the key and the host's network
privsep:
  user: "65531"
