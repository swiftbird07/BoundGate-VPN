# A reverse proxy (docs/REVERSE-PROXY.md): nginx with ModSecurity in front of the
# web services of this host, configured from the BoundGate control plane, as a
# node of the overlay. Host network: the sites listen on this host's addresses
# (443, 8443, ... as the sites say), ACME on 80, and the tunnel device the
# node installs belongs to the host.
#
# The image is the one BOUNDGATE_IMAGE in .env names, pinned by digest by
# `./update.sh pin` after it checked the release signature: update.sh sees
# reverse-proxy.yaml here and takes the release's reverse proxy image.
#
#   cp reverse-proxy.yaml.example reverse-proxy.yaml   # name, control plane, ACME
#   mkdir -p secrets && (umask 077; printf '%s\n' TOKEN > secrets/cloudflare.token)
#   ./update.sh pin && docker compose up -d
#   docker compose exec proxy boundgatectl enroll     # confirm with endpoint + reverse-proxy, sign
#   docker compose exec proxy boundgatectl status     # extra: revision, nginx, certificates
#
# Privilege separation is not optional here (docs/PRIVSEP.md, docs/REVERSE-PROXY.md
# R154): a root parent keeps the device key and does the network work; the
# node, the controller, the certificates and nginx run as uid 65531. nginx is
# started by the parent as that user with NET_BIND_SERVICE for :80 and :443
# and nothing else; it never runs as root. ./state keeps the identity, the
# ACME account and keys (0600), the rule sets and the nginx revisions;
# ./logs the nginx and ModSecurity logs.
name: boundgate-reverse-proxy

services:
  proxy:
    image: ${BOUNDGATE_IMAGE:?BOUNDGATE_IMAGE is not set in .env - run ./update.sh pin (docs/REVERSE-PROXY.md)}
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, SETUID, SETGID, CHOWN, KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run/boundgate:size=1m,mode=0755
      - /tmp:size=64m,mode=1777
    devices:
      - /dev/net/tun:/dev/net/tun
      # - /dev/tpmrm0:/dev/tpmrm0           # key_kind: tpm2 (docs/TPM.md)
    volumes:
      - ./reverse-proxy.yaml:/etc/boundgate/reverse-proxy.yaml:ro
      - ./state:/var/lib/boundgate
      - ./logs:/var/log/boundgate
      - ./secrets:/etc/boundgate/secrets:ro   # cloudflare.token, maxmind.key (0600, owner 65531)
    command: ["boundgate-reverse-proxy", "-config", "/etc/boundgate/reverse-proxy.yaml"]
