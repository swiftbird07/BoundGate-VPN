# BoundGate all-in-one: control plane and a hub on one Linux server, from the
# prebuilt image (docs/DEPLOY.md). Everything uses the host's network: a hub
# is a router whose tunnel device, routes and NAT belong to the host, and the
# mux must see real client addresses.
#
# The image is the one BOUNDGATE_IMAGE in .env names, pinned by digest:
# `./update.sh pin` writes it after checking the release signature (setup.sh
# does that), and `./update.sh` moves it to the next signed release. There is
# no default: a compose file that fell back to a tag would run whatever that
# tag points at today.
#
# One public address, port 443 shared (the usual case): the mux owns 443 on
# TCP and UDP and routes by TLS server name to control plane and hub, which
# listen on loopback (behind_mux in control.yaml and hub.yaml). Start it
# with the `mux` profile:
#
#   ./update.sh pin                             # BOUNDGATE_IMAGE=...@sha256:... into .env
#   docker compose --profile mux up -d          # or COMPOSE_PROFILES=mux in .env
#   docker compose exec hub boundgatectl enroll
#
# Two addresses (control plane and hub each own port 443 of their own IP):
# leave the profile off, set `listen` in control.yaml and hub.yaml to the
# respective address and drop `behind_mux`; then control and hub need
# NET_BIND_SERVICE for port 443: add it to their cap_add below.
#
# Who runs as whom: the mux as 65534 and the control plane (and lego) as
# 65532, without any capability; the hub as root with NET_ADMIN only. Their
# directories belong to those users (setup.sh does that; by hand:
# docs/DEPLOY.md, "Install").
#
# Updating: ./update.sh (signed releases, docs/RELEASES.md)
name: boundgate

x-image: &image ${BOUNDGATE_IMAGE:?BOUNDGATE_IMAGE is not set in .env - run ./update.sh pin (docs/DEPLOY.md)}

services:
  mux:
    image: *image
    profiles: [mux]
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ./mux.yaml:/etc/boundgate/mux.yaml:ro
    command: ["boundgate-mux", "-config", "/etc/boundgate/mux.yaml"]

  # Listens on 127.0.0.1:8443 behind the mux: no capability at all. It writes
  # only its state, the certificates and its logs; /tmp for SQLite.
  control:
    image: *image
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    cap_drop: [ALL]
    # cap_add: [NET_BIND_SERVICE]              # only without the mux, when control.yaml listens on :443 itself
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./control.yaml:/etc/boundgate/control.yaml:ro
      - ./state/control:/var/lib/boundgate     # database, node-channel key (back it up), ACME cache, bootstrap token
      - ./state/certs:/var/lib/boundgate/certs  # certificates from the acme-dns service (profile dns-acme)
      - ./logs/control:/var/log/boundgate
    command: ["boundgate-control", "-config", "/etc/boundgate/control.yaml"]

  # Let's Encrypt by DNS challenge (profile dns-acme), for servers whose port
  # 443 the CA cannot reach: geo-blocking, an allowlist, no public admin UI.
  # lego proves the name through your DNS provider's API, writes the
  # certificate to ./state/certs/certificates/<name>.crt|.key, renews it, and
  # the control plane picks up the new files by itself. In control.yaml:
  # acme.enabled: false, tls_cert/tls_key pointing at those files (see the
  # example). In .env: BG_DOMAIN. In lego.env (chmod 600), and nowhere else:
  # LEGO_EMAIL, LEGO_DNS (the provider name, e.g. hetzner, cloudflare, inwx,
  # ionos, route53, ...) and that provider's variables, e.g. HETZNER_API_KEY;
  # https://go-acme.github.io/lego/dns/ lists them. lego gets that file only,
  # not .env, and ./state/certs only.
  #
  # lego is pinned by digest (v4.35.2, released 2026-04-24; this command line
  # is lego 4's, lego 5 has another one). A newer lego comes with a new
  # version of this file, not with update.sh.
  acme-dns:
    image: goacme/lego:v4.35.2@sha256:ae124a405844759b201b31efbd7a0ba302dbd16e86f2fb177c4b6db8bdc782c8
    profiles: [dns-acme]
    restart: unless-stopped
    user: "65532:65532"                        # the control plane's user: it reads what lego writes
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    env_file:
      - path: lego.env
        required: false
    environment:
      LEGO_DOMAIN: ${BG_DOMAIN:-bg.example.com}
      HOME: /tmp
    volumes:
      - ./state/certs:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -f "/data/certificates/$$LEGO_DOMAIN.json" ]; then
            lego --accept-tos --path /data --email "$$LEGO_EMAIL" --dns "$$LEGO_DNS" --domains "$$LEGO_DOMAIN" renew --days 30
          else
            lego --accept-tos --path /data --email "$$LEGO_EMAIL" --dns "$$LEGO_DNS" --domains "$$LEGO_DOMAIN" run
          fi
          sleep 43200
        done

  # A router: its tunnel device, routes and nftables rules are the host's.
  # NET_ADMIN is all of that (ip, nft, the TUN device); no NET_RAW, no
  # other default capability.
  hub:
    image: *image
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]                       # + NET_BIND_SERVICE without the mux, when hub.yaml listens on :443
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run/boundgate:size=1m,mode=0755     # the daemon's socket
      - /tmp:size=16m,mode=1777
    devices:
      - /dev/net/tun:/dev/net/tun
      # a TPM or vTPM for the hub's key (key_kind: tpm2 in hub.yaml, docs/TPM.md):
      # - /dev/tpmrm0:/dev/tpmrm0
    depends_on: [control]
    volumes:
      - ./hub.yaml:/etc/boundgate/node.yaml:ro
      - ./state/hub:/var/lib/boundgate         # the device identity
      - ./logs/hub:/var/log/boundgate
    command: ["boundgate-node", "-config", "/etc/boundgate/node.yaml"]
