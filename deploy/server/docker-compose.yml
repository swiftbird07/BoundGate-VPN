# BoundGate on one Linux server with one public address (docs/DEPLOY.md):
# the mux owns :443 (TCP and UDP) and routes by TLS server name to the
# control plane (127.0.0.1:8443) and the hub (127.0.0.1:8444). Everything
# uses the host's network: a hub is a router, whose tunnel device, routes
# and NAT belong to the host, and the mux must see real client addresses.
#
#   docker compose up -d --build
#   docker compose exec hub boundgatectl enroll
name: boundgate

services:
  mux:
    build: { context: ., dockerfile: Dockerfile.mux }
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    volumes:
      - ./mux.yaml:/etc/boundgate/mux.yaml:ro
    command: ["boundgate-mux", "-config", "/etc/boundgate/mux.yaml"]

  control:
    build: { context: ., dockerfile: Dockerfile.control }
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./control.yaml:/etc/boundgate/control.yaml:ro
      - ./state/control:/var/lib/boundgate
      - ./logs/control:/var/log/boundgate
    command: ["boundgate-control", "-config", "/etc/boundgate/control.yaml"]

  hub:
    build: { context: ., dockerfile: Dockerfile.node }
    network_mode: host
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on: [control]
    volumes:
      - ./hub.yaml:/etc/boundgate/node.yaml:ro
      - ./state/hub:/var/lib/boundgate
      - ./logs/hub:/var/log/boundgate
      # a TPM or vTPM for the hub's key (key_kind: tpm2 in hub.yaml):
      # devices: ["/dev/net/tun:/dev/net/tun", "/dev/tpmrm0:/dev/tpmrm0"]
    command: ["boundgate-node", "-config", "/etc/boundgate/node.yaml"]
